name: Bug report
description: Something broken in a map or the mod
labels: [bug]
body:
  - type: dropdown
    id: map
    attributes:
      label: Map
      options:
        - Nacht der Untoten
        - Verrückt
        - Shi No Numa
        - Der Riese
        - Kino der Toten
        - '"Five"'
        - Ascension
        - Shangri-La
        - Moon
        - Call of the Dead
        - Menu / not map-specific
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Singleplayer
        - Multiplayer (co-op)
        - Both
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Mod version
      placeholder: e.g. v1.0.0
    validations:
      required: true
  - type: input
    id: plutonium-version
    attributes:
      label: Plutonium version
      placeholder: shown in the Plutonium launcher
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead. Round number and steps to reproduce if you have them.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: console_zm.log
      description: "If you can, attach the log from `%LOCALAPPDATA%\\Plutonium\\storage\\t6\\` (drag the file in). It does most of the diagnosing."
